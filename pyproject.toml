[project]
name = "paperformatpro"
version = "2.3.113"
description = "PaperFormat Pro - offline, safe overseas thesis format checker & fixer (docs never leave your machine)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ReedSkill" }]
keywords = ["docx", "thesis", "format-checker", "APA", "MLA", "IEEE", "academic-writing"]
dependencies = ["python-docx>=1.1.0", "pyyaml>=6.0", "pillow>=10.0.0"]

[project.urls]
Homepage = "https://paperformatpro.com"
Repository = "https://github.com/Reedgege/thesis-format-doctor-global"

[build-system]
requires = ["nuitka>=2.5"]
build-backend = "nuitka"  # 占位；实际通过 build.py / GitHub Actions 构建
