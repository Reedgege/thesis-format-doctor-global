# AI fill-in template — PaperFormat Pro
# Hand this file to any AI, have it fill in your school's format requirements as
# concrete values following the fields below, then load it with "Import AI form".
# The template also works with the older JSON format.

_purpose: |-
  Hand this file to any AI (GPT / Gemini / Claude, etc.) together with your school
  template or format-requirement document, and have the AI fill the format requirements
  into concrete values following the fields below, producing a YAML with the same
  structure (the older JSON format is also supported). Then load it into PaperFormat Pro
  with "Import AI form".

_how_to_fill: |-
  The AI should fill the format requirements as concrete values. Both structures are supported:
  ① flat top-level key-values (matching fields[].key); or
  ② wrapped in a filled object (e.g. filled: {...}).
  Leave unknown items blank or omit them; do not invent values.
  Units: margins / indents in inches, font size / space-after in points, line spacing as a multiple
  (2.0 = double, 1.5 = one-and-a-half, 1.0 = single).
  body_alignment must be one of left / justify / center / right
  (left = left-aligned, justify = justified).

fields:
  - key: margin_top_in
    label: Top margin
    unit: in
    example: 1.0
  - key: margin_bottom_in
    label: Bottom margin
    unit: in
    example: 1.0
  - key: margin_left_in
    label: Left margin
    unit: in
    example: 1.0
  - key: margin_right_in
    label: Right margin
    unit: in
    example: 1.0
  - key: font_family
    label: Body font
    unit: ""
    example: Times New Roman
  - key: font_size_pt
    label: Body font size
    unit: pt
    example: 12.0
  - key: line_spacing
    label: Line spacing
    unit: x
    example: 2.0
  - key: body_alignment
    label: Body alignment
    unit: ""
    example: left
    allowed: [left, justify, center, right]
  - key: first_line_indent_in
    label: Body first-line indent
    unit: in
    example: 0.5
  - key: space_after_pt
    label: Space after paragraph
    unit: pt
    example: 0.0
  - key: heading_levels
    label: Heading levels
    unit: levels
    example: 0
  - key: reference_style
    label: Reference format
    unit: ""
    example: APA
    allowed: [APA, MLA, Chicago, IEEE, Harvard]
  - key: reference_hanging_indent_in
    label: Reference hanging indent
    unit: in
    example: 0.5
  - key: reference_numbered
    label: Numbered references
    unit: ""
    example: false

example_filled:
  margin_top_in: 1.0
  margin_bottom_in: 1.0
  margin_left_in: 1.5
  margin_right_in: 1.0
  font_family: Times New Roman
  font_size_pt: 12.0
  line_spacing: 2.0
  body_alignment: left
  first_line_indent_in: 0.5
  space_after_pt: 0.0
  heading_levels: 5
  reference_style: APA
  reference_hanging_indent_in: 0.5
  reference_numbered: false
