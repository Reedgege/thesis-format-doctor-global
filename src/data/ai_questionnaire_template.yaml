# AI fill-in template — PaperFormat Pro
# Hand this file to any AI, have it fill in your school's format requirements as
# concrete values following the fields below, then load it back with the "Import"
# button (Format source → "Import configuration (AI)").
# The template also works with the older JSON format.

_purpose: |-
  Hand this file to any AI (GPT / Gemini / Claude, etc.) together with your school
  template or format-requirement document, and have the AI fill the format requirements
  into concrete values following the fields below, producing a YAML with the same
  structure (the older JSON format is also supported).
  Then load it back into PaperFormat Pro: set Format source to
  "Import configuration (AI)" and press "Import". The other format sources ignore
  this file, so pick that one first.
  The format requirements cover page layout (margins, body font, font size, line spacing,
  first-line indent, paragraph spacing, and the column layout — single vs two-column),
  heading levels, and the reference style.

_how_to_fill: |-
  The AI should fill the format requirements as concrete values. Both structures are supported:
  ① flat top-level key-values (matching fields[].key); or
  ② wrapped in a filled object (e.g. filled: {...}).
  Leave unknown items blank or omit them; do not invent values.
  Units: margins / indents in inches, font size / space-before / space-after in points,
  line spacing as a multiple
  (2.0 = double, 1.5 = one-and-a-half, 1.0 = single).
  body_alignment must be one of left / justify / center / right
  (left = left-aligned, justify = justified).
  header_distance_in is the distance from the top edge of the page to the header, in inches.
  Only fill it if the requirement states it (MLA 9 uses 0.5); otherwise omit it.
  columns is the page column layout and MUST be output as an integer:
  1 = single column (the default for most theses and papers),
  2 = two-column (typically an IEEE conference/journal template).
  Try to determine it from the requirement; if the requirement says nothing about the
  column layout, use 1 rather than omitting it.
  title_page_title_centered / title_page_title_bold / title_page_author_centered describe the
  title page (the thesis title and the author/affiliation lines). They are true or false.
  Omit any of them when the requirement says nothing about that property — do not guess,
  because a guessed value will make the tool actively change the student's title page.
  title_page_space_before_pt / title_page_space_after_pt are the space above / below the
  thesis title on the title page, in points ("1 line" ≈ 1.2 × the title's font size).
  Omit them when the requirement says nothing.
  abstract_space_before_pt / abstract_space_after_pt and caption_space_before_pt /
  caption_space_after_pt are the space above / below each Abstract paragraph and each
  figure/table caption, in points. Omit them when the requirement says nothing.
  paper_size is the physical paper size and MUST be one of Letter / A4 / Legal / A5:
  Letter = 8.5 x 11 in (United States, Canada), A4 = 210 x 297 mm
  (Europe, China, Australia, most of Asia). This is NOT part of any citation style —
  the same APA paper is printed on Letter in New York and on A4 in London. Only fill it
  when the requirement/school states it; otherwise omit it (do not guess from the style).
  page_number_position says WHERE the page number goes. It MUST be one of
  top-right / bottom-center / bottom-right. Note that top-right means the top-right corner
  of the HEADER (that is what APA and MLA ask for); bottom-center means centered in the
  FOOTER, which is the common requirement in Chinese universities. Only fill it when the
  requirement states it; otherwise omit it (do not infer it from the citation style).
  heading_formats is where the per-level heading requirements go. It is a map keyed by
  heading level (1 = top level). Each level accepts the same fields:
    font_family, size_pt, bold, italic, uppercase, run_in, alignment, indent_in, number_prefix,
    page_break_before, space_before_pt, space_after_pt, line_spacing
  - bold / italic / uppercase / run_in / page_break_before are true or false. Omit any of them
    when the requirement says nothing about that property for that level (do not guess).
  - space_before_pt / space_after_pt are the space above / below that heading level, in points
    (0 = explicitly no extra space). Omit them when the requirement says nothing.
  - line_spacing is that heading level's line-spacing multiple (2.0 = double). Omit it when the
    requirement says nothing.
  - page_break_before = whether this heading level must start on a new page (true = page break
    before the heading, e.g. a dissertation chapter; false = explicitly no page break, e.g. a
    journal article). Omit it when the requirement says nothing.
  - alignment must be one of left / center / right / justify.
  - indent_in is the first-line indent of that heading level, in inches (0 = flush left).
  - number_prefix is the chapter-number style used by that level:
    number "1." / roman "I." / upper_letter "A." / lower_letter "a)" /
    lower_roman "i)" / number_paren "1)". Omit it when headings are not numbered.
  heading_levels can be left out when heading_formats is present — the deepest level
  filled in is used as the level count.

fields:
  - key: margin_top_in
    label: Top margin
    unit: in
    example: 1.0
  - key: margin_bottom_in
    label: Bottom margin
    unit: in
    example: 1.0
  - key: margin_left_in
    label: Left margin
    unit: in
    example: 1.0
  - key: margin_right_in
    label: Right margin
    unit: in
    example: 1.0
  - key: font_family
    label: Body font
    unit: ""
    example: Times New Roman
  - key: font_size_pt
    label: Body font size
    unit: pt
    example: 12.0
  - key: line_spacing
    label: Line spacing
    unit: x
    example: 2.0
  - key: body_alignment
    label: Body alignment
    unit: ""
    example: left
    allowed: [left, justify, center, right]
  - key: first_line_indent_in
    label: Body first-line indent
    unit: in
    example: 0.5
  - key: space_before_pt
    label: Space before paragraph
    unit: pt
    example: 0.0
  - key: space_after_pt
    label: Space after paragraph
    unit: pt
    example: 0.0
  - key: header_distance_in
    label: Header distance from top
    unit: in
    example: 0.5
  - key: columns
    label: Columns
    unit: ""
    example: 1
    allowed: [1, 2]
  - key: title_page_title_centered
    label: Title page - title centered
    unit: ""
    example: true
    allowed: [true, false]
    note: Omit when the requirement says nothing about centering the title on the title page.
  - key: title_page_title_bold
    label: Title page - title bold
    unit: ""
    example: true
    allowed: [true, false]
    note: Omit when unspecified. MLA explicitly forbids bolding the title.
  - key: title_page_author_centered
    label: Title page - author lines centered
    unit: ""
    example: true
    allowed: [true, false]
    note: Omit when unspecified. APA/IEEE center the author and affiliation lines, MLA does not.
  - key: title_page_space_before_pt
    label: Title page - space before the title
    unit: pt
    example: 0.0
    note: >-
      Space above the thesis title on the title page, in points. "1 line" at 12 pt ≈ 14 pt
      (1.2 × font size). APA adds no extra space. Omit when unspecified.
  - key: title_page_space_after_pt
    label: Title page - space after the title
    unit: pt
    example: 12.0
    note: >-
      Space below the thesis title on the title page, in points. Omit when unspecified.
  - key: paper_size
    label: Paper size
    unit: ""
    example: A4
    allowed: [Letter, A4, Legal, A5]
    note: Omit when the requirement says nothing — paper size is not part of a citation style.
  - key: page_number_position
    label: Page number position
    unit: ""
    example: top-right
    allowed: [top-right, bottom-center, bottom-right]
    note: >-
      top-right = top-right corner of the header (APA/MLA); bottom-center = centered in the
      footer (common in Chinese theses). Omit when the requirement says nothing. The tool
      will then add an automatic PAGE field there and replace a hand-typed page number.
  - key: heading_levels
    label: Heading levels
    unit: levels
    example: 0
    note: Optional when heading_formats is filled in (deepest level wins).
  - key: heading_formats
    label: Per-level heading format
    unit: ""
    note: >-
      Map of heading level (1 = top level) to that level's requirements. Fields per level:
      font_family, size_pt, bold, italic, uppercase, run_in, alignment (left/center/right/justify),
      indent_in (inches), number_prefix (number/roman/upper_letter/lower_letter/lower_roman/number_paren),
      page_break_before, space_before_pt, space_after_pt, line_spacing.
  - key: reference_style
    label: Reference format
    unit: ""
    example: custom
    allowed: [custom, APA, MLA, IEEE]
    note: >-
      "custom" = apply only the reference entry rules you filled in below (font, size,
      line spacing, hanging indent, numbering, heading bold/centred) and do NOT check the
      entries against any built-in citation style. Use APA / MLA / IEEE only when the
      requirement genuinely names that style; even then it affects the reference list only,
      never the page setup or the headings.
  - key: reference_hanging_indent_in
    label: Reference hanging indent
    unit: in
    example: 0.5
  - key: reference_numbered
    label: Numbered references
    unit: ""
    example: false
  - key: reference_font_family
    label: Reference entry font
    unit: ""
    example: SimSun
    note: Omit to follow the body font.
  - key: reference_size_pt
    label: Reference entry font size
    unit: pt
    example: 10.5
    note: Omit to follow the body text (10.5 pt and 12 pt are common).
  - key: reference_line_spacing
    label: Reference entry line spacing
    unit: x
    example: 1.0
    note: Omit to follow the body text. 1.0 = single (common for entries).
  - key: reference_space_before_pt
    label: Space before each reference entry
    unit: pt
    example: 0.0
    note: 0 = no blank line between entries (the usual requirement). Omit if unspecified.
  - key: reference_space_after_pt
    label: Space after each reference entry
    unit: pt
    example: 0.0
    note: 0 = no blank line between entries (the usual requirement). Omit if unspecified.
  - key: reference_new_page
    label: References start on a new page
    unit: ""
    example: true
    note: true / false. Omit when the requirement says nothing about it.
  - key: reference_heading_bold
    label: Reference heading bold
    unit: ""
    example: true
    note: true / false. Omit when unspecified (MLA requires not bold).
  - key: reference_heading_centered
    label: Reference heading centered
    unit: ""
    example: true
    note: true / false. Omit when unspecified (IEEE is left-aligned).
  - key: abstract_first_line_indent_in
    label: Abstract first-line indent
    unit: in
    example: 0.0
    note: >-
      Abstract body first-line indent. APA abstracts are flush left (0.0); most styles do not
      indent the abstract. Omit when the requirement says nothing about it.
  - key: abstract_new_page
    label: Abstract starts on a new page
    unit: ""
    example: true
    allowed: [true, false]
    note: >-
      true = the Abstract begins on a new page (APA Professional); false = it continues on the
      same page. Omit when unspecified.
  - key: abstract_space_before_pt
    label: Abstract - space before each paragraph
    unit: pt
    example: 0.0
    note: >-
      Space above each Abstract paragraph, in points. "1 line" at 12 pt ≈ 14 pt. APA adds no
      extra space (0). Omit when unspecified.
  - key: abstract_space_after_pt
    label: Abstract - space after each paragraph
    unit: pt
    example: 0.0
    note: >-
      Space below each Abstract paragraph, in points. APA adds no extra space (0). Omit when
      unspecified.
  - key: running_head_required
    label: Running head required
    unit: ""
    example: true
    allowed: [true, false]
    note: >-
      true = a running head is required in the header (short title for APA Professional, last name
      + page number for MLA). Omit when the requirement says nothing about it.
  - key: page_number_include_author_name
    label: Page number includes author name
    unit: ""
    example: true
    allowed: [true, false]
    note: >-
      true = the page number is preceded by the author's last name (MLA's "Smith 1"). Omit when
      unspecified. The name itself cannot be auto-generated; this only checks/reminds.
  - key: caption_font_size_pt
    label: Caption font size
    unit: pt
    example: 10.0
    note: Figure/table caption font size. Omit to follow the body text.
  - key: caption_line_spacing
    label: Caption line spacing
    unit: x
    example: 1.0
    note: Figure/table caption line spacing. Omit to follow the body text.
  - key: caption_space_before_pt
    label: Caption - space before
    unit: pt
    example: 6.0
    note: >-
      Space above the figure/table caption, in points (schools often specify 6–12 pt to
      separate the caption from the body). Omit when unspecified.
  - key: caption_space_after_pt
    label: Caption - space after
    unit: pt
    example: 6.0
    note: >-
      Space below the figure/table caption, in points. Omit when unspecified.
  - key: caption_position_table
    label: Table caption position
    unit: ""
    example: top
    allowed: [top, bottom]
    note: >-
      top = the table caption sits ABOVE the table (APA/IEEE); bottom = below the table. Omit when
      unspecified. This is a hint only (not auto-fixed).
  - key: caption_position_figure
    label: Figure caption position
    unit: ""
    example: bottom
    allowed: [top, bottom]
    note: >-
      top = the figure caption sits ABOVE the figure; bottom = below the figure (APA/IEEE). Omit
      when unspecified. This is a hint only (not auto-fixed).

example_filled:
  margin_top_in: 1.0
  margin_bottom_in: 1.0
  margin_left_in: 1.5
  margin_right_in: 1.0
  font_family: Times New Roman
  font_size_pt: 12.0
  line_spacing: 2.0
  body_alignment: left
  first_line_indent_in: 0.5
  space_before_pt: 0.0
  space_after_pt: 0.0
  # header_distance_in: 0.5   # optional — only when the requirement states it (MLA 9)
  columns: 1
  # paper_size: A4      # optional — only when the requirement states it (no default)
  # page_number_position: top-right       # optional — top-right (header) / bottom-center (footer)
  # title_page_title_centered: true      # optional — omit when unspecified
  # title_page_title_bold: true          # optional — omit when unspecified
  # title_page_author_centered: true     # optional — omit when unspecified
  # title_page_space_before_pt: 0        # optional — space above the title, in points
  # title_page_space_after_pt: 12        # optional — space below the title, in points
  heading_levels: 3
  heading_formats:
    1:
      font_family: SimHei
      size_pt: 16
      bold: true
      alignment: center
      number_prefix: number
      # Space above / below the heading, in points (a very common requirement).
      space_before_pt: 12
      space_after_pt: 6
      # line_spacing: 1.5
    2:
      font_family: KaiTi
      size_pt: 14
      bold: true
      italic: false
      alignment: left
      space_before_pt: 6
      space_after_pt: 6
    3:
      font_family: SimSun
      size_pt: 12
      bold: true
      italic: false
      alignment: left
      indent_in: 0.5
  # Only set APA / MLA / IEEE when the requirement really names that citation style.
  # Otherwise leave it as "custom" and let the entry rules below do the work —
  # a citation style affects the reference list only, never page setup or headings.
  reference_style: custom
  reference_hanging_indent_in: 0.5
  reference_numbered: false
  # The reference list itself is often formatted differently from the body text.
  # Omit any of these when the requirement says nothing about them.
  # reference_font_family: SimSun
  # reference_size_pt: 10.5
  # reference_line_spacing: 1.0
  # reference_new_page: true
  # reference_heading_bold: true
  # reference_heading_centered: true
  # The abstract and captions are often formatted differently from the body text.
  # Omit any of these when the requirement says nothing about them.
  # abstract_first_line_indent_in: 0.0   # APA abstracts are flush left
  # abstract_new_page: true              # APA Professional: Abstract on its own page
  # abstract_space_before_pt: 0          # space above each Abstract paragraph, in points
  # abstract_space_after_pt: 0           # space below each Abstract paragraph, in points
  # running_head_required: true          # APA Professional / MLA require a running head
  # page_number_include_author_name: true  # MLA: "Smith 1"
  # caption_font_size_pt: 10.0
  # caption_line_spacing: 1.0
  # caption_space_before_pt: 6           # space above the caption, in points
  # caption_space_after_pt: 6            # space below the caption, in points
  # caption_position_table: top          # APA/IEEE: caption above the table
  # caption_position_figure: bottom      # APA/IEEE: caption below the figure
