name: Cross-platform functional check

# 同一个版本、同一份文档，在三个操作系统上跑同样的「体检 → 一键修正 → 复检」，
# 结果与 Windows 基准逐条比对。
#
# 为什么要在 CI 的三个平台都跑同一套：
#   只在 macOS 上跑，看到差异时无法判断"是 macOS 特有"还是"未激活试用路径特有"
#   —— CI 每次都是全新机器指纹，走的正是客户首次安装时的试用路径。
#   三个平台同时跑，差异一出现就能立刻分辨。
#
# 只测海外版 PaperFormat Pro：它有三段式 CLI（check / fix --preview / fix），
# 国内两版的引擎被编译进主程序、没有子命令，只能验到启动级（见 macos-smoke.yml）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 tag（留空=最新 release）"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/crossplat.yml"
      - "tools/crossplat/**"

jobs:
  functional:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            asset: "paperformatpro-windows*.zip"
            exe: paperformatpro.exe
          - os: macos-latest
            label: macOS
            asset: "paperformatpro-macos*.zip"
            exe: paperformatpro
          - os: ubuntu-latest
            label: Linux x64
            # Linux 发的是 AppImage / deb，没有 zip。取 AppImage：
            # 用 --appimage-extract 解开，不依赖 FUSE。
            asset: "paperformatpro-linux*.AppImage"
            exe: paperformatpro
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_INPUT: ${{ github.event.inputs.tag }}
    steps:
      - name: 取测试工具与基准（本仓）
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/crossplat
            src
            VERSION
          sparse-checkout-cone-mode: false

      - name: 源码诊断：页码修正到底断在哪一环
        # 诊断是辅助手段，绝不能让它的失败掩盖真正的功能验证结果
        continue-on-error: true
        shell: bash
        run: |
          # 只用源码 + 同版本 python-docx 复现这一环，逐环打印中间值。
          # 不需要激活码：只跑 check 并直接调用一个内部函数，不走授权门禁。
          # 三平台都跑，输出并排一看就知道是"平台差异"还是"打包差异"。
          #
          # 🔴 输出必须压成**一条**注解：GitHub 每个 step 只保留前几条注解，
          # 逐行 echo ::notice:: 会在第 8 行之后被静默丢掉（上一轮就只看到
          # fix_dims 之前的内容，误以为脚本挂了）。
          set -o pipefail
          # 🔴 Windows runner 上没有 python3（只有 python），统一探测一次
          PY=$(command -v python3 2>/dev/null || command -v python || true)
          if [ -z "$PY" ]; then PY=python; fi
          echo "PY = $PY ($("$PY" --version 2>&1 || echo 无法执行))"
          "$PY" -m pip install --quiet python-docx==1.2.0 pyyaml==6.0.3 2>/dev/null \
            || "$PY" -m pip install --quiet --break-system-packages python-docx==1.2.0 pyyaml==6.0.3 \
            || echo "::warning::pip 安装 python-docx 失败，继续用系统已有的版本"
          D="$RUNNER_TEMP/dbg.txt"
          "$PY" tools/crossplat/debug_page_number.py \
            tools/crossplat/fixtures/bad_apa.docx \
            "$RUNNER_TEMP/debug_out.docx" > "$D" 2>&1 || true
          cat "$D"
          "$PY" - "$D" <<'PY'
          import sys, io
          p = sys.argv[1]
          s = io.open(p, encoding="utf-8", errors="replace").read()
          s = s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::notice::" + s[:60000])
          PY

      - name: 取证（仅 Linux）：strace 看产物到底去哪个路径找页眉模板
        # 这是最直接的证据：python-docx 建页眉时要读 docx/templates/default-header.xml，
        # 它靠 os.path.split(__file__) 推路径。若 Nuitka 打包后 __file__ 不可靠，
        # open() 就会找不到文件 → 异常被 except 吞掉 → 页眉建不起来。
        # strace 会把所有 openat 的完整路径打出来，带 ENOENT 的那几条就是答案。
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PY=$(command -v python3 2>/dev/null || command -v python)
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq strace >/dev/null 2>&1 || { echo "::warning::装不上 strace，跳过取证"; exit 0; }
          "$PY" tools/crossplat/fetch_and_verify.py             --repo Reedgege/thesis-format-doctor-global             --asset "paperformatpro-linux*.AppImage"             --exe paperformatpro             --label "Linux strace"             --exe-path-out /tmp/exe_path.txt             --no-verify || exit 0
          BIN=$(cat /tmp/exe_path.txt)
          echo "BIN = $BIN"
          D=$(dirname "$BIN")
          echo "--- 产物的 docx/templates 实际位置 ---"
          find "$D" -name "default-header.xml" -o -name "default-footer.xml" 2>/dev/null | head
          echo "--- __file__ 提示：templates 相对 docx 包的位置 ---"
          ls -d "$D"/docx 2>/dev/null || true
          strace -f -e trace=openat,stat,newfstatat -o /tmp/st.txt \
            "$BIN" fix tools/crossplat/fixtures/bad_apa.docx --spec APA-Student \
            --out /tmp/st_out.docx --json >/dev/null 2>&1 || true
          R="$RUNNER_TEMP/strace_hdr.txt"
          {
            echo "### 产物里 templates 的实际路径"
            find "$D" -name "default-*.xml" 2>/dev/null | head -6
            echo "### strace 里所有涉及 template/header/footer 的 open 记录"
            grep -iE "default-header|default-footer|templates" /tmp/st.txt 2>/dev/null | head -40
            echo "### 其中带 ENOENT 的"
            grep -iE "default-header|default-footer" /tmp/st.txt 2>/dev/null | grep ENOENT | head -10
          } > "$R" 2>&1 || true
          cat "$R"
          "$PY" - "$R" <<'PY2'
          import sys, io
          s = io.open(sys.argv[1], encoding="utf-8", errors="replace").read()
          s = s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::notice::[strace 取证] " + s[:50000])
          PY2

      - name: 下载产物 → 三步验证 → 与基准比对
        shell: bash
        run: |
          set -o pipefail
          EXTRA=""
          if [ -n "${TAG_INPUT:-}" ]; then EXTRA="--tag $TAG_INPUT"; fi
          PY=$(command -v python3 2>/dev/null || command -v python || true)
          if [ -z "$PY" ]; then PY=python; fi
          echo "PY = $PY ($("$PY" --version 2>&1 || echo 无法执行))"
          "$PY" tools/crossplat/fetch_and_verify.py \
            --repo Reedgege/thesis-format-doctor-global \
            --label "${{ matrix.label }} ($(uname -m 2>/dev/null || echo win))" \
            --asset "${{ matrix.asset }}" \
            --exe "${{ matrix.exe }}" \
            $EXTRA

  # ---------------------------------------------------------------------------
  # 最小复现：只用 Nuitka 打包 python-docx，验证「创建页眉」在产物里能不能成
  #
  # 为什么需要它：线上 2.3.122 在 macOS / Linux 上修不出页码，Windows 正常；
  # 同一份源码在 macOS 上用外部 python-docx 跑又完全正常，
  # 数据文件（docx/templates/default-header.xml）在三个平台的包里也都齐全。
  # 于是嫌疑只剩「Nuitka 打包后的那一份 python-docx」，而这一步没法从产物外部观察到，
  # 只能用同样的编译方式造一个最小程序，把中间值打出来。
  #
  # 定位完成后本 job 可以删掉（它跑一次要几分钟）。
  # ---------------------------------------------------------------------------
  nuitka-repro:
    name: Nuitka 最小复现 ${{ matrix.label }}
    # 纯诊断 job：结论只用于定位，不该把流水线整体判红
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    steps:
      - name: 取复现脚本与测试文档
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/crossplat
          sparse-checkout-cone-mode: false

      - name: 用 Nuitka 编译并运行
        shell: bash
        run: |
          set -o pipefail
          PY=$(command -v python3 2>/dev/null || command -v python || true)
          if [ -z "$PY" ]; then PY=python; fi
          echo "PY = $PY ($("$PY" --version 2>&1 || echo 无法执行))"
          "$PY" -m pip install --quiet nuitka python-docx==1.2.0 2>/dev/null \
            || "$PY" -m pip install --quiet --break-system-packages nuitka python-docx==1.2.0 \
            || { echo "::error::pip 安装 nuitka 失败"; exit 1; }
          cd tools/crossplat/nuitka_repro
          "$PY" -m nuitka --standalone --assume-yes-for-downloads \
            --output-dir=build repro.py > /tmp/compile.log 2>&1 \
            || { tail -30 /tmp/compile.log; echo "::error::Nuitka 编译失败"; exit 1; }
          BIN=$(ls build/repro.dist/repro build/repro.dist/repro.exe 2>/dev/null | head -1)
          [ -n "$BIN" ] || { ls -la build/repro.dist 2>/dev/null | head; echo "::error::找不到编译产物"; exit 1; }
          echo "BIN = $BIN"
          chmod +x "$BIN" 2>/dev/null || true
          O="/tmp/repro_${{ matrix.label }}.txt"
          "$BIN" ../fixtures/bad_apa.docx /tmp/repro_out.docx > "$O" 2>&1 || true
          cat "$O"
          python - "$O" "${{ matrix.label }}" <<'PY'
          import sys, io
          p, label = sys.argv[1], sys.argv[2]
          s = io.open(p, encoding="utf-8", errors="replace").read()
          s = s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::notice::[%s] %s" % (label, s[:60000]))
          PY
