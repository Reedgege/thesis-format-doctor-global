name: macOS launch smoke

# 目的：macOS 包以前只验"打包成功 + 资源清单"，从没真启动过。这一步把线上
# Release 里的 macos.zip 下下来，在真 Mac 上验证**启动级**：
#   二进制能不能起来、活过 20 秒、架构是什么、运行时资源齐不齐、签名状态。
#
# 分工：**功能级**验证（体检 → 修正 → 复检，与基准逐条比对）不在这里，
# 统一由 crossplat.yml 在 Windows / macOS / Linux 三平台同时跑。
# 那个流水线能一次跑出三平台数据，出现差异时才能分辨"平台特有"还是"通用问题"。
#
# 为什么国内两版只能验到启动级：它们的引擎（tfd_app/core/*.py）打包时被编译进
# 主程序，产物里没有可独立执行的引擎脚本，也没有 check 子命令（main.py 直接起 GUI）。
# 所以对它们只能验"运行时数据齐全 + GUI 真能起来"。
#
# 它证明不了什么：用户从网上下载后 Gatekeeper 会不会放行（取决于公证/签名，
# 而 CI 里 curl 下载的文件不带 quarantine 属性）。那一条只能真机验。
#
# 🔴 血泪：别把 .app 路径用 $GITHUB_ENV 传给下一步 —— 每个 step 的工作目录都会重置，
# 相对路径必然找不到文件；而且 `set -u` 遇到未定义变量会**在打印任何东西之前**直接退出，
# 连诊断注解都发不出来。所以这里统一用固定绝对路径 /tmp/pkg 落地，
# 解压/看架构/启动全在一个 step 里，不跨 step 传变量。

on:
  # 改本文件时自动跑一次（省得手点），三个产品一起验
  push:
    paths:
      - ".github/workflows/macos-smoke.yml"
      - "tools/crossplat/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定 Release tag（留空=各仓最新 release）"
        required: false
        default: ""

jobs:
  smoke:
    name: ${{ matrix.label }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 海外 PaperFormat Pro
            repo: Reedgege/thesis-format-doctor-global
            pattern: "paperformatpro-macos.zip"
          - label: 学生 文档格式先生
            repo: Reedgege/thesis-format-doctor-desktop
            pattern: "MDF-Stu-macos.zip"
          - label: 导师 文档格式先生·导师版
            repo: Reedgege/tfd-mentor
            pattern: "MDF-Advisor-macos.zip"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_INPUT: ${{ github.event.inputs.tag }}
    steps:
      - name: 取基准与测试工具（本仓）
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/crossplat
          sparse-checkout-cone-mode: false

      - name: 下载、解压、看架构、真启动一次
        shell: bash
        run: |
          set -o pipefail
          fail() { echo "::error::$1"; exit 1; }

          REPO="${{ matrix.repo }}"
          PATTERN="${{ matrix.pattern }}"
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg && cd /tmp/pkg

          # 没指定 tag 就取该仓最新 release，发版后无需改本文件
          if [ -n "${TAG_INPUT:-}" ]; then
            API="https://api.github.com/repos/$REPO/releases/tags/$TAG_INPUT"
          else
            API="https://api.github.com/repos/$REPO/releases/latest"
          fi
          echo "查询 $API"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" "$API" -o rel.json \
            || fail "取 release 信息失败：$API"
          TAG=$(python3 -c "import json;print(json.load(open('rel.json'))['tag_name'])")
          echo "tag = $TAG"
          URL=$(python3 -c "
          import json,sys
          d=json.load(open('rel.json'))
          pat='$PATTERN'
          hits=[a['browser_download_url'] for a in d['assets'] if a['name']==pat]
          if not hits:
              hits=[a['browser_download_url'] for a in d['assets']
                    if 'macos' in a['name'].lower() and a['name'].endswith('.zip')]
          print(hits[0] if hits else '')
          ")
          [ -n "$URL" ] || fail "$REPO 的 release $TAG 里找不到 macos zip（期望 $PATTERN）"
          NAME=$(basename "$URL")
          echo "下载 $URL"
          curl -fL --retry 3 -o "$NAME" "$URL" || fail "下载失败：$URL"
          unzip -q "$NAME" -d out || fail "解压失败：$NAME"

          APP=$(find out -maxdepth 2 -name "*.app" | head -1)
          [ -n "$APP" ] || fail "包里没有 .app 目录"
          APP="$(cd "$(dirname "$APP")" && pwd)/$(basename "$APP")"
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 | head -1)
          [ -n "$BIN" ] || fail "Contents/MacOS 下找不到可执行文件"
          echo "$BIN" > /tmp/pkg/exe_path.txt
          echo "APP = $APP"
          echo "BIN = $BIN"
          ls -l "$BIN"
          file "$BIN"

          ARCHS=$(lipo -archs "$BIN" 2>/dev/null || echo unknown)
          echo "::notice::[${{ matrix.label }}] tag=$TAG 架构=$ARCHS ；runner=$(uname -m)"
          case "$ARCHS" in
            *arm64*x86_64*|*x86_64*arm64*) : ;;
            *arm64*) echo "::warning::[${{ matrix.label }}] 仅 arm64，Intel Mac 无法运行（历史遗留，非本次回归）" ;;
            *) echo "::warning::[${{ matrix.label }}] 架构异常：$ARCHS" ;;
          esac

          echo "--- 包内运行时资源（启动级验证的一部分）---"
          M="$APP/Contents/MacOS"
          for d in tcl-files tk-files; do
            if [ -d "$M/$d" ]; then
              echo "  $d: $(find "$M/$d" -type f | wc -l | tr -d ' ') 个文件"
            else
              echo "::warning::[${{ matrix.label }}] 缺 $d 目录（Tk 可能起不来）"
            fi
          done
          if [ -d "$M/tfd_app/assets" ]; then
            N=$(find "$M/tfd_app/assets" -type f ! -name "._*" | wc -l | tr -d ' ')
            echo "  tfd_app/assets: $N 个文件"
            [ "$N" -ge 8 ] || echo "::warning::[${{ matrix.label }}] assets 只有 $N 个文件，疑似打包漏收"
          fi
          [ -f "$APP/Contents/Resources/icon.icns" ] && echo "  icon.icns 在位" || echo "::warning::[${{ matrix.label }}] 缺 icon.icns"

          echo "--- 签名/公证现状（只报告，不判红）---"
          codesign -dv --verbose=2 "$BIN" 2>&1 | head -6 || true
          spctl --assess --type execute --verbose "$BIN" 2>&1 | head -2 || true

          echo "== 真启动：直接执行二进制，看能否活过 20 秒 =="
          "$BIN" > /tmp/app.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            echo "::notice::[${{ matrix.label }}] ✅ 启动成功，存活 20 秒（PID $PID）"
            head -15 /tmp/app.log || true
            exit 0
          fi
          echo "进程已退出，日志："
          tail -40 /tmp/app.log || true
          echo "::error::[${{ matrix.label }}] ❌ 启动即退出，这个包有问题"
          head -10 /tmp/app.log 2>/dev/null | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::error::  $line"
          done
          exit 1
