name: macOS smoke

# 目的：macOS 包从来只有「打包成功 + 资源清单校验」，**从没真启动过一次**。
# 这个流水线把线上 Release 里的 macos.zip 下下来，在真 Mac 上跑一遍，
# 把架构、签名状态、启动存活结果打成注解（注解不需要鉴权，本地能读到）。
#
# 它证明什么：二进制本身能在这台 Mac 上起来并活过 20 秒。
# 它证明不了什么：用户从网上下载后 Gatekeeper 会不会放行（取决于公证/签名，
# 而 CI 里 curl 下载的文件不带 quarantine 属性）。那一条只能真机验。
#
# 🔴 血泪：别把 .app 路径用 $GITHUB_ENV 传给下一步 —— 每个 step 的工作目录都会重置，
# 相对路径必然找不到文件；而且 `set -u` 遇到未定义变量会**在打印任何东西之前**直接退出，
# 连诊断注解都发不出来。所以这里解压/看架构/启动全在一个 step 里，不传变量。

on:
  # 改本文件时自动跑一次（省得手点），三个产品一起验
  push:
    paths:
      - ".github/workflows/macos-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.label }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 海外 PaperFormat Pro
            repo: Reedgege/thesis-format-doctor-global
            tag: v2.3.122
            asset: paperformatpro-macos.zip
            exe: paperformatpro
          - label: 学生 文档格式先生
            repo: Reedgege/thesis-format-doctor-desktop
            tag: v1.3.162
            asset: MDF-Stu-macos.zip
            exe: MDF-Stu
          - label: 导师 文档格式先生·导师版
            repo: Reedgege/tfd-mentor
            tag: v1.1.58
            asset: MDF-Advisor-macos.zip
            exe: MDF-Advisor
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 解压、看架构、真启动一次
        shell: bash
        run: |
          set -o pipefail
          fail() { echo "::error::$1"; exit 1; }

          NAME="${{ matrix.asset }}"
          URL="https://github.com/${{ matrix.repo }}/releases/download/${{ matrix.tag }}/$NAME"
          echo "下载 $URL"
          mkdir -p pkg && cd pkg
          curl -fL --retry 3 -o "$NAME" "$URL" || fail "下载失败：$URL"
          unzip -q "$NAME" -d out || fail "解压失败：$NAME"

          APP=$(find out -maxdepth 2 -name "*.app" | head -1)
          [ -n "$APP" ] || fail "包里没有 .app 目录"
          APP="$(cd "$(dirname "$APP")" && pwd)/$(basename "$APP")"
          EXEN="${{ matrix.exe }}"
          BIN="$APP/Contents/MacOS/$EXEN"
          if [ ! -f "$BIN" ]; then BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 | head -1); fi
          [ -n "$BIN" ] || fail "Contents/MacOS 下找不到可执行文件"
          echo "APP = $APP"
          ls -l "$BIN"
          file "$BIN"
          ARCHS=$(lipo -archs "$BIN" 2>/dev/null || echo unknown)
          echo "notice-arch=$ARCHS"
          echo "::notice::[${{ matrix.label }}] 主程序架构 = $ARCHS ；runner = $(uname -m)"

          echo "--- 签名/公证现状（只报告，不判红）---"
          codesign -dv --verbose=2 "$BIN" 2>&1 | head -6 || true
          spctl --assess --type execute --verbose "$BIN" 2>&1 | head -2 || true

          echo "== 真启动：直接执行二进制，看能否活过 20 秒 =="
          "$BIN" > /tmp/app.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            echo "::notice::[${{ matrix.label }}] ✅ 启动成功，存活 20 秒（PID $PID）"
            head -15 /tmp/app.log || true
            exit 0
          fi
          echo "进程已退出，日志："
          tail -40 /tmp/app.log || true
          echo "::error::[${{ matrix.label }}] ❌ 启动即退出，这个包有问题"
          head -10 /tmp/app.log 2>/dev/null | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::error::  $line"
          done
          exit 1
