name: macOS smoke

# 目的：macOS 包从来只有「打包成功 + 资源清单校验」，**从没真启动过一次**。
# 这个流水线把线上 Release 里那个 macos.zip 下下来，在真 Mac 上跑一遍，
# 把架构、启动结果、日志打成注解（注解不需要鉴权，本地能读到）。
#
# 它证明什么：二进制本身能在这台 Mac 上起来并活过 20 秒。
# 它证明不了什么：用户从网上下载后 Gatekeeper 会不会放行（那取决于公证/签名，
# 而 CI 里 curl 下载的文件不带 quarantine 属性）。这一条只能真机验。

on:
  # 改本文件时自动跑一次（省得手点），默认参数打的是最新那个 tag
  push:
    paths:
      - ".github/workflows/macos-smoke.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "从哪个 Release 取 macOS 包（如 v2.3.122）"
        required: true
        default: "v2.3.122"
      repo:
        description: "产物所在仓库（owner/repo）"
        required: true
        default: "Reedgege/thesis-format-doctor-global"
      asset_name:
        description: "Release 里的 macOS zip（留空自动找 *macos*.zip）"
        required: false
        default: ""

jobs:
  smoke:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || 'v2.3.122' }}
      REL_REPO: ${{ inputs.repo || 'Reedgege/thesis-format-doctor-global' }}
      ASSET: ${{ inputs.asset_name || '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 下载线上 macOS 包
        shell: bash
        run: |
          set -euo pipefail
          name="$ASSET"
          if [ -z "$name" ]; then
            name=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REL_REPO/releases/tags/$TAG" \
              | python3 -c "import json,sys;d=json.load(sys.stdin);print([a['name'] for a in d['assets'] if 'macos' in a['name'] and a['name'].endswith('.zip')][0])")
          fi
          echo "资产：$name"
          mkdir -p pkg
          curl -fL --retry 3 -o "pkg/$name" \
            "https://github.com/$REL_REPO/releases/download/$TAG/$name"
          ls -l pkg

      - name: 解压并看架构
        shell: bash
        run: |
          set -euo pipefail
          cd pkg
          unzip -q *.zip -d out
          APP=$(find out -maxdepth 2 -name "*.app" | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          BIN="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable 2>/dev/null || basename "$APP" .app)"
          if [ ! -x "$BIN" ]; then BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -1); fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "这是一个 .app 包"
          file "$BIN"
          echo "::notice::主程序架构 = $(lipo -archs "$BIN" 2>/dev/null || echo 未知) （单架构 arm64 = Intel Mac 跑不了）"
          echo "runner 自身架构 = $(uname -m)"
          # 签名/公证现状（只报告，不判红：ad-hoc 签名是我们现在的常态）
          codesign -dv --verbose=2 "$BIN" 2>&1 | head -8 || true
          spctl --assess --type execute --verbose "$BIN" 2>&1 | head -3 || true

      - name: 真启动一次（等 20 秒看进程还在不在）
        shell: bash
        run: |
          set -uo pipefail
          # 失败详情必须打成注解 —— 日志接口要鉴权，注解不用
          dump_log() {
            local tag="$1"
            echo "::error::$tag 失败，日志如下（最多 10 行）"
            head -10 /tmp/app.log 2>/dev/null | while IFS= read -r line; do
              line="${line//'%'/'%25'}"; line="${line//$'\r'/}"
              echo "::error::  $line"
            done
          }

          echo "== 方式一：直接执行 .app 里的二进制 =="
          echo "BIN=$BIN"
          "$BIN" > /tmp/app.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "::notice::方式一成功：直接执行二进制，存活 20 秒（PID $PID）"
            kill "$PID" 2>/dev/null || true
            exit 0
          fi
          echo "方式一没起来（进程已退出），日志尾部："
          tail -30 /tmp/app.log || true
          dump_log "方式一"

          echo "== 方式二：走 LaunchServices（open -a，最接近用户双击）=="
          open -a "$APP" --args --smoke 2>/tmp/open.log || true
          sleep 20
          PIDS=$(pgrep -f "paperformatpro" || true)
          if [ -n "$PIDS" ]; then
            echo "::notice::方式二成功：open -a 拉起来的进程存活 20 秒（PID $PIDS）"
            pkill -f "paperformatpro" || true
            exit 0
          fi
          echo "方式二也没起来，open 的报错："
          cat /tmp/open.log 2>/dev/null || true
          echo "::error::两种启动方式都没活过 20 秒，这个 macOS 包在本 runner 上跑不起来"
          exit 1
