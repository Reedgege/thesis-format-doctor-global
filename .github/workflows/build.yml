name: Build Desktop (Win/macOS/Linux)

# Run name: tag push -> shows the tag (e.g. v2.0.0); plain push -> first commit line.
run-name: Build ${{ github.ref_type == 'tag' && github.ref_name || github.event.head_commit.message }}

on:
  # Only build & publish on a pushed v* tag. Release flow: bump VERSION -> git tag vX.Y.Z
  # -> git push origin vX.Y.Z. The three platform builds run in parallel, then a single
  # release is published with all artifacts attached.
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # 回归测试。跑在 Windows runner 上（带 tkinter、且与主要分发平台一致），
  # 必须在构建之前通过：测试挂了就别浪费十几分钟做三平台构建 + 发版。
  # 2026-09-11 补：此前 .gitignore 的 test_*.py 把所有测试挡在仓库外，CI 也没有
  # 任何跑测试的步骤 —— 回归网等于 0（换台机器就全丢）。
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run regression tests
        run: python -m pytest tests -q -p no:cacheprovider

      # 真机入口验证：「无参数启动必须进 GUI」—— 这就是"双击打不开"的回归防线。
      # 打包版用 --windows-console-mode=disable，没有控制台可看，静默退出=用户以为没反应。
      - name: Verify entry point (no-arg must open the GUI)
        run: python tools/verify_entry.py

  build:
    name: ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            ext: ".exe"
          - os: macos
            runner: macos-latest
            ext: ""
          - os: linux
            runner: ubuntu-latest
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Nuitka compiles to native machine code - in Defender's eyes it is a
      # normal C++ program (very low false-positive rate), and the source is compiled
      # away. Python 3.12 comes from setup-python; the compiler is provided by the
      # runner (MSVC / clang / gcc) - no extra install.
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Nuitka
        run: python -m pip install --upgrade nuitka

      # Linux needs the Tk runtime for the tkinter GUI to bundle correctly.
      - name: Install Tk runtime (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk tcl zip

      # macOS wants .icns for the app icon (PNG -> ICNS via Pillow).
      - name: Generate icon.icns (macOS only)
        if: matrix.os == 'macos'
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/icon.icns', format='ICNS', sizes=[(16,16),(32,32),(64,64),(128,128),(256,256),(512,512),(1024,1024)])"
          ls -la assets/icon.icns

      # Nuitka compiles to a standalone folder (no runtime self-extract -> no dropper fingerprint).
      - name: Build (${{ matrix.os }})
        shell: bash
        run: python build.py

      # Windows: wrap the standalone folder into a single installer exe (double-click install).
      # Must use pwsh, not bash: Git Bash would mangle /DVERSION=... into a path.
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        run: choco install nsis --no-progress

      - name: Build installer (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $VER = (Get-Content VERSION).Trim()
          $VERNUM = $VER -replace '^v',''
          $MAKENSIS = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $MAKENSIS)) { $MAKENSIS = "makensis" }
          & $MAKENSIS /DVERSION=$VER /DVERNUM=$VERNUM installer.nsi
          ls thesis-format-doctor-global-setup.exe

      # Windows: dual distribution - the zip (portable, green) is the primary download;
      # the setup.exe is the alternative for users who want an installer.
      - name: Package (Windows zip)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist\thesis-format-doctor-global" -DestinationPath "release\thesis-format-doctor-global-windows.zip" -Force
          ls release

      - name: Package (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k -v "dist/thesis-format-doctor-global.app" "release/thesis-format-doctor-global-macos.zip"

      - name: Package (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p release
          cd dist && zip -r "../release/thesis-format-doctor-global-linux.zip" "thesis-format-doctor-global"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: thesis-format-doctor-global-${{ matrix.os }}
          path: |
            thesis-format-doctor-global-setup.exe
            release/thesis-format-doctor-global-windows.zip
            release/thesis-format-doctor-global-macos.zip
            release/thesis-format-doctor-global-linux.zip
          if-no-files-found: ignore
          retention-days: 1

  reedcode:
    name: Offline Code Generator (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Nuitka
        run: python -m pip install --upgrade nuitka

      # Standalone folder build (no self-extract dropper fingerprint). The generator is
      # pure tkinter + stdlib, so it compiles small and bundles its own Tcl/Tk.
      - name: Build generator (Windows)
        shell: bash
        run: python build_reedcode.py

      - name: Package (Windows zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist\reedcode-global" -DestinationPath "release\reedcode-global-windows.zip" -Force
          ls release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: reedcode-global-windows
          path: release/reedcode-global-windows.zip
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Publish Release
    # ⚠️ 必须同时等 build 和 reedcode 两个 job：只 needs: build 的话，release 可能在
    # 发码器产物上传之前就开跑，download-artifact 收不到 reedcode-global-windows.zip，
    # Release 会静默少一个产物（v2.0.1 只是恰好顺序对上了，属于竞态）。
    # 两个都成功才发版：缺一不发 —— 宁可暴露问题，也不要静默少产物。
    needs: [build, reedcode]
    if: needs.build.result == 'success' && needs.reedcode.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release
          # 主程序三平台
          for plat in windows macos linux; do
            find "artifacts/thesis-format-doctor-global-$plat" -type f 2>/dev/null | while read f; do
              cp "$f" "release/$(basename "$f")"
            done
          done
          # 离线发码工具（Windows 卖家端）
          find "artifacts/reedcode-global-windows" -type f 2>/dev/null | while read f; do
            cp "$f" "release/$(basename "$f")"
          done
          ls -la release
          # 产物清单校验：缺任何一个都直接失败，避免发出「少东西」的 Release。
          # 期望 5 个：windows.zip / setup.exe / macos.zip / linux.zip / reedcode-global-windows.zip
          EXPECTED="thesis-format-doctor-global-windows.zip
          thesis-format-doctor-global-setup.exe
          thesis-format-doctor-global-macos.zip
          thesis-format-doctor-global-linux.zip
          reedcode-global-windows.zip"
          missing=""
          for f in $EXPECTED; do
            if [ ! -f "release/$f" ]; then missing="$missing $f"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release assets missing:$missing"
            exit 1
          fi
          echo "Asset check passed: 5/5"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(cat VERSION | tr -d '[:space:]')"
            [ -z "$version" ] && version="latest"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: release/*
          generate_release_notes: true
          allow_override: true
