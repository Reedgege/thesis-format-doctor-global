name: Build Desktop (Win/macOS/Linux)

# Run name: tag push -> shows the tag (e.g. v2.0.0); plain push -> first commit line.
run-name: Build ${{ github.ref_type == 'tag' && github.ref_name || github.event.head_commit.message }}

on:
  # Only build & publish on a pushed v* tag. Release flow: bump VERSION -> git tag vX.Y.Z
  # -> git push origin vX.Y.Z. The three platform builds run in parallel, then a single
  # release is published with all artifacts attached.
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # 回归测试。跑在 Windows runner 上（带 tkinter、且与主要分发平台一致），
  # 必须在构建之前通过：测试挂了就别浪费十几分钟做三平台构建 + 发版。
  # 2026-09-11 补：此前 .gitignore 的 test_*.py 把所有测试挡在仓库外，CI 也没有
  # 任何跑测试的步骤 —— 回归网等于 0（换台机器就全丢）。
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pytest

      - name: Run regression tests
        # 输出落到文件再 tee：本机无 GitHub API admin 权限时下载不到 Actions 日志，
        # 只能靠构件把失败详情带出来（见下一步 Upload）。
        run: |
          python -m pytest tests -q -p no:cacheprovider --tb=long -rA 2>&1 | Tee-Object -FilePath pytest-log.txt
          exit $LASTEXITCODE

      # 把 pytest 输出作为构件留下来（即使上一步失败也要传）：
      # GitHub Actions 的 job logs 需要仓库 admin 权限才能下载，出包被卡住时
      # 没有构件就只能靠猜。有了它，任何环境都能拿到"到底哪条用例红"。
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: pytest-log.txt
          if-no-files-found: warn
          # 这份日志只在「用例红」时有价值，90 天默认保留纯属占配额。
          retention-days: 1

      # 把失败用例变成 **workflow 注解**（v2.3.89）。
      # 为什么加这一步：构件和 job logs 都要鉴权才能下，而注解走
      # `GET /repos/{o}/{r}/check-runs/{id}/annotations` 是**匿名可读**的。
      # 2026-10-22 v2.3.88 就卡在这里 —— CI 红在 Tests(Windows)，可本机既没有
      # admin 也没有 PAT，拿不到「到底哪条用例红了」，只能靠猜（违反"先取证"）。
      # 现在任何一台机器、不带任何凭据，都能把失败用例原文拉出来。
      - name: Surface test failures as annotations
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path pytest-log.txt)) { Write-Host "no pytest-log.txt"; exit 0 }
          $hits = Select-String -Path pytest-log.txt -Pattern '^(FAILED|ERROR) ' | Select-Object -First 25
          if (-not $hits) { Write-Host "no FAILED/ERROR lines - all good"; exit 0 }
          foreach ($h in $hits) {
            $msg = $h.Line.Trim()
            $msg = $msg -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Host "::error title=pytest::$msg"
          }

      # 真机入口验证：「无参数启动必须进 GUI」—— 这就是"双击打不开"的回归防线。
      # 打包版用 --windows-console-mode=disable，没有控制台可看，静默退出=用户以为没反应。
      - name: Verify entry point (no-arg must open the GUI)
        run: python tools/verify_entry.py

  build:
    name: ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            ext: ".exe"
          - os: macos
            runner: macos-latest
            ext: ""
          - os: linux
            runner: ubuntu-latest
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Nuitka compiles to native machine code - in Defender's eyes it is a
      # normal C++ program (very low false-positive rate), and the source is compiled
      # away. Python 3.12 comes from setup-python; the compiler is provided by the
      # runner (MSVC / clang / gcc) - no extra install.
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Nuitka
        run: python -m pip install --upgrade nuitka

      # 离线激活验签为**纯标准库 Ed25519**（src/license/ed25519_verify.py），
      # 无任何第三方加密依赖，故无需在此安装 crypto 包。公钥已嵌入源码，
      # 私钥只在卖家本机（绝不进 CI）。

      # Linux needs the Tk runtime for the tkinter GUI to bundle correctly.
      - name: Install Tk runtime (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk tcl zip

      # macOS wants .icns for the app icon (PNG -> ICNS via Pillow).
      - name: Generate icon.icns (macOS only)
        if: matrix.os == 'macos'
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/icon.icns', format='ICNS', sizes=[(16,16),(32,32),(64,64),(128,128),(256,256),(512,512),(1024,1024)])"
          ls -la assets/icon.icns

      # Nuitka compiles to a standalone folder (no runtime self-extract -> no dropper fingerprint).
      # Offline activation uses Ed25519 (pure-stdlib verify; public key embedded in source,
      # private key only on the seller's machine) — no repository secret needed; the build
      # never touches any key.
      - name: Build (${{ matrix.os }})
        shell: bash
        run: python build.py

      # Windows: wrap the standalone folder into a single installer exe (double-click install).
      # Must use pwsh, not bash: Git Bash would mangle /DVERSION=... into a path.
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        run: choco install nsis --no-progress

      - name: Build installer (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $VER = (Get-Content VERSION).Trim()
          $VERNUM = $VER -replace '^v',''
          $MAKENSIS = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $MAKENSIS)) { $MAKENSIS = "makensis" }
          & $MAKENSIS /DVERSION=$VER /DVERNUM=$VERNUM installer.nsi
          ls paperformatpro-setup.exe

      # Windows: dual distribution - the zip (portable, green) is the primary download;
      # the setup.exe is the alternative for users who want an installer.
      - name: Package (Windows zip)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist\paperformatpro" -DestinationPath "release\paperformatpro-windows.zip" -Force
          ls release

      # macOS distribution: fix the app bundle metadata, re-sign ad-hoc, then ship a
      # zip (the .app folder must stay at the top level) plus a dmg.
      #
      # Two bugs fixed here on 2026-11-14 — every macOS build before this was broken:
      #   1. `ditto -c -k` without --keepParent archives the *contents* of the folder,
      #      so the zip's top level was `Contents/`. Buyers unpacked it, got a plain
      #      folder named Contents, double-clicked it, and nothing happened. macOS never
      #      recognized it as an app. The Mac build had been unusable the whole time.
      #   2. Nuitka writes a literal "1.0" into CFBundleShortVersionString, so Finder
      #      showed the wrong version. (The Chinese builds also got a non-ASCII
      #      CFBundleIdentifier, which Apple's conventions don't allow.)
      #
      # Editing Info.plist invalidates the signature Nuitka applied, and Apple Silicon
      # refuses to launch any binary without at least an ad-hoc signature. So re-sign.
      - name: Package (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/paperformatpro.app"
          PLIST="$APP/Contents/Info.plist"
          VER="$(cat VERSION | tr -d '[:space:]' | sed 's/^v//')"
          echo "building version $VER"

          plist_set() {  # set if the key exists, add otherwise
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
          }
          plist_set CFBundleIdentifier         "com.paperformatpro.app"
          plist_set CFBundleShortVersionString "$VER"
          plist_set CFBundleVersion            "$VER"
          plist_set LSMinimumSystemVersion     "11.0"
          plist_set CFBundleDisplayName        "PaperFormat Pro"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"

          # Drop the old signature folder first so a stale CodeResources can't fight the new one.
          rm -rf "$APP/Contents/_CodeSignature"
          codesign --force --deep --sign - "$APP" || codesign --force --sign - "$APP"
          codesign --verify --verbose=2 "$APP" 2>&1 | head -10 || true

          mkdir -p release
          # --keepParent keeps paperformatpro.app as the top-level entry in the zip.
          ditto -c -k --keepParent -v "$APP" "release/paperformatpro-macos.zip"
          # Fail the build if the top level is wrong — that is exactly the bug above.
          python3 - <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile("release/paperformatpro-macos.zip")
          tops = sorted({n.split("/")[0] for n in z.namelist()})
          print("zip top level:", tops)
          if tops != ["paperformatpro.app"]:
              print("!! top level is not paperformatpro.app; unpacking gives a useless folder")
              sys.exit(1)
          print("OK top level correct")
          PY

          # dmg: the app, a shortcut to /Applications, and first-launch notes.
          STAGE="dmg-stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cat > "$STAGE/Read Me First.txt" <<'TXT'
          PaperFormat Pro for macOS
          =========================

          Install
            1. Drag "PaperFormat Pro.app" onto the Applications folder.
            2. Open Applications and double-click PaperFormat Pro.

          First launch blocked?

            macOS refuses to open apps that aren't notarized by Apple. You'll see
            "cannot be opened" or "is damaged". The download is fine — this is the
            gatekeeper check doing its job.

            macOS 15 (Sequoia) or later
              Open System Settings > Privacy & Security and scroll to Security.
              You'll see "PaperFormat Pro was blocked from use." Click Open Anyway
              and enter your login password.

            macOS 14 (Sonoma) or earlier
              Right-click the app, choose Open, then click Open again in the dialog.

          Requirements
            macOS 11.0 (Big Sur) or later
            Apple Silicon only (M1 / M2 / M3 / M4)
            Intel Macs aren't supported yet. Email us if you need one.

          Support
            hi@paperformatpro.com
            https://paperformatpro.com
          TXT

          hdiutil create -volname "PaperFormat Pro" -srcfolder "$STAGE" \
            -ov -format UDZO "release/paperformatpro-macos.dmg"
          ls -la release/
          hdiutil attach "release/paperformatpro-macos.dmg" -nobrowse -readonly -mountpoint /tmp/dmgchk
          test -d "/tmp/dmgchk/paperformatpro.app" && echo "OK dmg contains the app"
          test -f "/tmp/dmgchk/Read Me First.txt" && echo "OK dmg contains the readme"
          hdiutil detach /tmp/dmgchk -force

      - name: Package (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p release
          cd dist && zip -r "../release/paperformatpro-linux.zip" "paperformatpro"

      # 构建后自检：运行时资源（图标 / AI 问卷模板 / VERSION）必须真的进了产物。
      # 姊妹项目导师版真栽过 —— build.py 漏数据目录，打包版「二维码不显示、水印图
      # 丢失」却能一路绿灯发出去（读取方都有 isfile 守卫 → 全程静默）。
      - name: Verify bundled runtime assets
        shell: bash
        run: python tools/verify_bundle.py dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperformatpro-${{ matrix.os }}
          path: |
            paperformatpro-setup.exe
            release/paperformatpro-windows.zip
            release/paperformatpro-macos.zip
            release/paperformatpro-macos.dmg
            release/paperformatpro-linux.zip
          if-no-files-found: ignore
          retention-days: 1

  # NOTE: the offline code generator is intentionally NOT built here, and its source is
  # NOT in this repository. Signing now lives in a seller-local unified issuer
  # (reedcode_unified.py, kept OUTSIDE the repo next to the Ed25519 private keys), so the
  # public repo contains nothing that could forge an offline code. History:
  #   1) Private-repo CI minutes are exhausted; every saved job counts.
  #   2) Public repo + a built signer exe in the Release = trivial reverse-engineering
  #      target for anyone who wants to sign their own codes.
  # Do NOT reintroduce a signer job here, nor 'needs: [build, reedcode]' on release.

  release:
    name: Publish Release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release
          # 主程序三平台（reedcode 已下线，见上方注释）
          for plat in windows macos linux; do
            find "artifacts/paperformatpro-$plat" -type f 2>/dev/null | while read f; do
              cp "$f" "release/$(basename "$f")"
            done
          done
          ls -la release
          # 产物清单校验：缺任何一个都直接失败，避免发出「少东西」的 Release。
          # 期望 5 个：windows.zip / setup.exe / macos.zip / macos.dmg / linux.zip
          EXPECTED="paperformatpro-windows.zip
          paperformatpro-setup.exe
          paperformatpro-macos.zip
          paperformatpro-macos.dmg
          paperformatpro-linux.zip"
          missing=""
          for f in $EXPECTED; do
            if [ ! -f "release/$f" ]; then missing="$missing $f"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release assets missing:$missing"
            exit 1
          fi
          echo "Asset check passed: 5/5"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(cat VERSION | tr -d '[:space:]')"
            [ -z "$version" ] && version="latest"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: release/*
          generate_release_notes: true
          allow_override: true

      # Release 资产已挂好，本次 run 的构件当场回收。
      # 为什么必须回收：构件只是「跨 job 传包」的中转（Release 资产不占 Actions 的
      # 500MB artifact 配额），但默认仍会留到过期。同一天连打多个 tag 时，多个 run
      # 的构件同时在场会把配额撑爆 → 下次 upload-artifact 直接报
      # "Artifact storage quota has been hit"，整个 Release 发不出来。
      - name: Recycle artifacts (Release 已有资产)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ids=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "recycled artifact $id"
          done
          left=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.total_count' 2>/dev/null || echo '?')
          echo "artifacts left in this run: $left"
