name: MSIX probe

# 探路用工作流，**不参与正式发版**。
# 目的只有一个：证明「现有 Windows 产物 → .msix → 装上 → 能启动」这条链是通的，
# 跑通之后再谈上传商店。正式发版仍在 build.yml 里，两边互不干扰。
#
# 为什么单独一个文件：build.yml 已经在发 6 个资产，Assets 清单、发版清单、
# R2 备料脚本、站点 SHA 表全是按 6 个写的。往里面塞第 7 个产物会牵动四处，
# 探路阶段不值得冒这个险。
#
# 🔴 调试纪律：job logs 要鉴权，我（本地）读不到；run 页面的 summary 是公开可读的。
# 所以每个易碎步骤都 try/catch 把真实异常写进 $env:GITHUB_STEP_SUMMARY，
# 失败时去看 https://github.com/<repo>/actions/runs/<id> 的页面即可，不必猜。

on:
  workflow_dispatch:
    inputs:
      product:
        description: "products.json 里的产品键"
        required: true
        default: "paperformatpro"
        type: choice
        options:
          - paperformatpro
          - mdf-stu
          - mdf-advisor
      tag:
        description: "从哪个 Release 取 Windows 包（如 v2.3.122）"
        required: true
        default: "v2.3.122"
      repo:
        description: "产物所在的仓库（owner/repo）"
        required: true
        default: "Reedgege/thesis-format-doctor-global"
      asset_name:
        description: "Release 里的 Windows 包文件名（留空 = 按 tag 自动找 *windows*.zip）"
        required: false
        default: ""
  # 改打包脚本或本文件时自动跑一次，省得每次手点
  push:
    paths:
      - "tools/make_msix.py"
      - "tools/msix/**"
      - ".github/workflows/msix.yml"

jobs:
  probe:
    runs-on: windows-latest
    env:
      PRODUCT: ${{ inputs.product || 'paperformatpro' }}
      TAG: ${{ inputs.tag || 'v2.3.122' }}
      REL_REPO: ${{ inputs.repo || 'Reedgege/thesis-format-doctor-global' }}
      ASSET: ${{ inputs.asset_name || '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 定位结果写进 build/sdk.env（普通文件，UTF-8 无 BOM），
      # 后面用 Get-Content 读回来 —— 不走 GITHUB_ENV，避开 Windows PowerShell
      # 5.1 默认 UTF-16LE 把 env 文件写坏那一类坑。
      - name: 定位 makeappx / signtool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 日志要鉴权，注解不需要 —— 失败详情一律打成 ::error:: 注解，便于本地取证
          function Show-Fail($title, $text) {
            Write-Host "::error::$title"
            $lines = ($text -split "`r?`n") | Where-Object { $_.Trim() } | Select-Object -First 10
            foreach ($l in $lines) {
              $safe = $l -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
              Write-Host "::error::$safe"
            }
            "### $title`n``````n$($text | Out-String)`n``````n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          function Find-Tool($name) {
            $kits = @("${env:ProgramFiles(x86)}\Windows Kits\10\bin", "$env:ProgramFiles\Windows Kits\10\bin")
            $hit = Get-ChildItem -Path $kits -Filter $name -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\x64\\' } |
                   Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $hit) { throw "镜像里找不到 $name（扫过：$($kits -join ' ; ')）" }
            return $hit.FullName
          }
          $ma = Find-Tool "makeappx.exe"
          $st = Find-Tool "signtool.exe"
          Write-Host "makeappx : $ma"
          Write-Host "signtool : $st"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $lines = "MAKEAPPX=$ma", "SIGNTOOL=$st"
          [IO.File]::WriteAllLines("$PWD/build/sdk.env", $lines, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content build/sdk.env

      - name: 下载 Release 里的 Windows 包
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 日志要鉴权，注解不需要 —— 失败详情一律打成 ::error:: 注解，便于本地取证
          function Show-Fail($title, $text) {
            Write-Host "::error::$title"
            $lines = ($text -split "`r?`n") | Where-Object { $_.Trim() } | Select-Object -First 10
            foreach ($l in $lines) {
              $safe = $l -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
              Write-Host "::error::$safe"
            }
            "### $title`n``````n$($text | Out-String)`n``````n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          try {
            New-Item -ItemType Directory -Force -Path build/download | Out-Null
            # 资产名不带版本号（paperformatpro-windows.zip），所以不写死：
            # 留空就按 tag 去 Release 里找 *windows*.zip；显式给了就直接用。
            $assetName = $env:ASSET
            if ([string]::IsNullOrWhiteSpace($assetName)) {
              $hdr = @{ "User-Agent" = "msix-probe"; "Accept" = "application/vnd.github+json" }
              if ($env:GH_TOKEN) { $hdr["Authorization"] = "Bearer $env:GH_TOKEN" }
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:REL_REPO/releases/tags/$env:TAG" -Headers $hdr
              $hit = $rel.assets | Where-Object { $_.name -match '(?i)windows.*\.zip$' } | Select-Object -First 1
              if (-not $hit) { throw "该 Release 里没有 windows zip，实际有：$($rel.assets.name -join ', ')" }
              $assetName = $hit.name
            }
            $url = "https://github.com/$env:REL_REPO/releases/download/$env:TAG/$assetName"
            $dst = "build/download/$assetName"
            Write-Host "资产名：$assetName"
            Write-Host "下载：$url"
            # 用 Invoke-WebRequest 而不是 curl.exe：异常信息更清楚，且不会因
            # 退出码语义（$LASTEXITCODE）在 PowerShell 里判断失灵。
            $ProgressPreference = "SilentlyContinue"
            Invoke-WebRequest -Uri $url -OutFile $dst -MaximumRedirection 10 -TimeoutSec 600
            $fi = Get-Item $dst
            Write-Host ("下载完成：{0}  {1:N2} MiB" -f $fi.Name, ($fi.Length / 1MB))
            if ($fi.Length -lt 5MB) { throw "下载的文件只有 $($fi.Length) 字节，不像完整包" }
          } catch {
            Show-Fail "下载步骤失败" $_
            throw
          }

      - name: 解压出产物目录
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 日志要鉴权，注解不需要 —— 失败详情一律打成 ::error:: 注解，便于本地取证
          function Show-Fail($title, $text) {
            Write-Host "::error::$title"
            $lines = ($text -split "`r?`n") | Where-Object { $_.Trim() } | Select-Object -First 10
            foreach ($l in $lines) {
              $safe = $l -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
              Write-Host "::error::$safe"
            }
            "### $title`n``````n$($text | Out-String)`n``````n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          try {
            $zip = Get-ChildItem build/download -Filter *.zip | Select-Object -First 1
            Write-Host "解压 $($zip.Name)"
            Expand-Archive -Path $zip.FullName -DestinationPath build/payload -Force
            Get-ChildItem build/payload | Select-Object -First 10 Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          } catch {
            Show-Fail "解压失败" $_
            throw
          }

      - name: 打 .msix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 日志要鉴权，注解不需要 —— 失败详情一律打成 ::error:: 注解，便于本地取证
          function Show-Fail($title, $text) {
            Write-Host "::error::$title"
            $lines = ($text -split "`r?`n") | Where-Object { $_.Trim() } | Select-Object -First 10
            foreach ($l in $lines) {
              $safe = $l -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
              Write-Host "::error::$safe"
            }
            "### $title`n``````n$($text | Out-String)`n``````n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          try {
            Get-Content build/sdk.env | ForEach-Object {
              $k, $v = $_.Split("=", 2); Set-Item -Path "env:$k" -Value $v
            }
            Write-Host "MAKEAPPX=$env:MAKEAPPX"
            $out = (& python tools/make_msix.py --product "$env:PRODUCT" `
              --payload build/payload --makeappx "$env:MAKEAPPX" `
              --out "build/$env:PRODUCT.msix" 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -ne 0) { throw ("make_msix.py 退出码 " + $code + "`n" + $out) }
            Get-Item "build/$env:PRODUCT.msix" | Format-List Name, Length
          } catch {
            Show-Fail "打包失败" $_
            throw
          }

      # 商店上传不需要自己签名（微软会签），但**本机安装验证必须有签名**，
      # 所以这里造一张自签证书只为跑通安装。证书绝不用于对外分发。
      - name: 自签 + 签名（仅用于本机验证）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 日志要鉴权，注解不需要 —— 失败详情一律打成 ::error:: 注解，便于本地取证
          function Show-Fail($title, $text) {
            Write-Host "::error::$title"
            $lines = ($text -split "`r?`n") | Where-Object { $_.Trim() } | Select-Object -First 10
            foreach ($l in $lines) {
              $safe = $l -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
              Write-Host "::error::$safe"
            }
            "### $title`n``````n$($text | Out-String)`n``````n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          try {
            Get-Content build/sdk.env | ForEach-Object {
              $k, $v = $_.Split("=", 2); Set-Item -Path "env:$k" -Value $v
            }
            $p = Get-Content tools/msix/products.json -Raw | ConvertFrom-Json
            $prod = $p.PSObject.Properties["$env:PRODUCT"].Value
            $publisher = $prod.publisher
            Write-Host "Publisher: $publisher"
            $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
              -KeyUsage DigitalSignature -FriendlyName "msix-probe" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            $sec = ConvertTo-SecureString -String "probe" -Force -AsPlainText
            $pfx = Join-Path $env:RUNNER_TEMP "probe.pfx"
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $sec | Out-Null
            & $env:SIGNTOOL sign /fd SHA256 /a /f $pfx /p "probe" "build/$env:PRODUCT.msix"
            if ($LASTEXITCODE -ne 0) { throw "signtool 退出码 $LASTEXITCODE" }
            # 让本机信任这张证书，否则 Add-AppxPackage 会以「不受信任」拒绝
            $cer = Join-Path $env:RUNNER_TEMP "probe.cer"
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
          } catch {
            Show-Fail "签名失败" $_
            throw
          }

      - name: 装上去并启动
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 日志要鉴权，注解不需要 —— 失败详情一律打成 ::error:: 注解，便于本地取证
          function Show-Fail($title, $text) {
            Write-Host "::error::$title"
            $lines = ($text -split "`r?`n") | Where-Object { $_.Trim() } | Select-Object -First 10
            foreach ($l in $lines) {
              $safe = $l -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
              Write-Host "::error::$safe"
            }
            "### $title`n``````n$($text | Out-String)`n``````n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          try {
            Add-AppxPackage -Path "build/$env:PRODUCT.msix"
            $p = Get-Content tools/msix/products.json -Raw | ConvertFrom-Json
            $prod = $p.PSObject.Properties["$env:PRODUCT"].Value
            $pfn = $prod.pfn
            $exe = $prod.executable -replace '\.exe$', ''
            Write-Host "PFN: $pfn  exe: $exe"
            $pkg = Get-AppxPackage | Where-Object { $_.PackageFamilyName -eq $pfn }
            if (-not $pkg) { throw "包没装上（Get-AppxPackage 查不到 $pfn）" }
            Write-Host "已安装：$($pkg.PackageFullName)"
            # 通过 AppsFolder 启动，等价于用户点开始菜单里的图标
            Start-Process "shell:AppsFolder\$pfn!App"
            Start-Sleep -Seconds 25
            $proc = Get-Process -Name $exe -ErrorAction SilentlyContinue
            if (-not $proc) { throw "装上了但进程没起来 —— 这条链还没通" }
            Write-Host "OK 进程在跑：$($proc[0].ProcessName) (PID $($proc[0].Id))"
            Stop-Process -Id $proc[0].Id -Force
            "### ✅ MSIX 探路通过：打包 → 签名 → 安装 → 启动 全通（$($pkg.PackageFullName)）" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } catch {
            Show-Fail "安装/启动失败" $_
            throw
          }

      - name: 收工清理
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $p = Get-Content tools/msix/products.json -Raw | ConvertFrom-Json
          $prod = $p.PSObject.Properties["$env:PRODUCT"].Value
          Get-AppxPackage | Where-Object { $_.PackageFamilyName -eq $prod.pfn } | Remove-AppxPackage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msix-probe-${{ inputs.product || 'paperformatpro' }}
          path: build/*.msix
          if-no-files-found: warn
          retention-days: 7
